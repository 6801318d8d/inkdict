name: Dictionaries

# Every day, build the dictionaries whose Wiktionary has a dump newer than their last release, and publish each one
# as a GitHub release `dict-<words>-<definitions>-<dump date>` (the release of the previous dump is deleted).
# One job per source Wiktionary: it downloads and parses the dump once, then builds its dictionaries one after
# another; it starts no new one after BUDGET_MINUTES, and the next day's run goes on with the rest.
# Wiktionary dumps come out about twice a month, so once a dump is done nothing is built until the next one.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      locales:
        description: "Only these locales, space separated (it = IT-IT, it:en = English words in Italian); empty: all"
        default: ""
      force:
        description: "Build even what is already released, or recorded as empty or failing"
        type: boolean
        default: false

permissions:
  actions: write  # to keep the schedule alive (below)
  contents: write

concurrency:
  group: dictionaries
  cancel-in-progress: false

env:
  # The 30 languages whose Wiktionary inkdict reads: their monolingual dictionaries, and every pair among them
  LANGUAGES: "bg ca cs da de el en eo es eu fi fr it ja jbo ko la lt mg nl no pl pt ro ru sv th tr uk zh"
  BILINGUAL_WITH: "all"
  MONOLINGUAL_ONLY: "jbo"  # no foreign_head_sections
  EXTRA_LOCALES: ""
  BUDGET_MINUTES: "240"
  FORMATS: "dicthtml,stardict,stardict-nosyn,mobi,dictfile,dictorg"
  KINDLING_VER: "v0.46.2"
  KINDLING_SHA256: "b61c883104c1f139313992d72e87e7c61617c31e59f5fe84748451b5cc6b11b0"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      # GitHub turns off the schedule of a public repository after 60 days without activity:
      # enabling the workflow again at every run resets that count
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/dictionaries.yml/enable"

      - uses: actions/checkout@v7

      - name: Find the dictionaries to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALES: ${{ inputs.locales }}
          FORCE: ${{ inputs.force || false }}
        run: python3 .github/scripts/plan_dictionaries.py

  build:
    needs: plan
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: ${{ matrix.source }} ${{ matrix.snapshot }}
    env:
      SOURCE: ${{ matrix.source }}
      SNAPSHOT: ${{ matrix.snapshot }}
      LOCALES: ${{ matrix.locales }}
      FORCE_SNAPSHOT: ${{ matrix.snapshot }}
      # /mnt has far more free space than / on GitHub's runners: the database of the English dump takes about 9 GB
      CWD: /mnt/inkdict
      NO_COLOR: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start time
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the requirements
        run: python -m pip install -r requirements.txt

      - name: Install kindling (Kindle dictionaries)
        run: |
          mkdir -p ~/.local/bin
          curl -sfL "https://github.com/ciscoriordan/kindling/releases/download/${KINDLING_VER}/kindling-cli-linux" -o ~/.local/bin/kindling
          echo "${KINDLING_SHA256}  $HOME/.local/bin/kindling" | sha256sum -c -
          chmod a+x ~/.local/bin/kindling

      - name: Working folder
        run: |
          sudo mkdir -p "$CWD"
          sudo chown "$USER" "$CWD"
          df -h / /mnt

      - name: Download
        run: python -m wikidict "$SOURCE" --download

      - name: Parse
        run: python -m wikidict "$SOURCE" --parse

      - name: Build and publish the dictionaries
        run: python .github/scripts/build_dictionaries.py
